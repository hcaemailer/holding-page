<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Coming Soon</title>
    
    <!-- Netlify Identity Widget for CMS invites -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Cloudflare Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            background-color: #1e293b; padding: 40px; border-radius: 12px;
            max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 12px; color: #fff; }
        p { font-size: 1rem; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 0.875rem; margin-bottom: 6px; color: #cbd5e1; }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 12px; border: 1px solid #334155;
            border-radius: 6px; background-color: #0f172a; color: #fff; font-size: 1rem;
        }
        .consent-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            margin-bottom: 16px;
            font-size: 0.8125rem;
            color: #94a3b8;
        }
        .consent-group input[type="checkbox"] {
            margin-top: 2px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .captcha-group {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
        }
        button {
            width: 100%; padding: 12px; background-color: #2563eb; color: white;
            border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        button:hover { background-color: #1d4ed8; }
        #form-msg { margin-top: 15px; font-size: 0.875rem; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="headline">Loading...</h1>
    <p id="subheadline">Please wait while we load updates.</p>
    
    <form id="signup-form">
        <div class="form-group">
            <label for="name">First Name</label>
            <input type="text" id="name" name="name" required placeholder="Jane">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="jane@example.com">
        </div>

        <!-- Opt-in Checkbox -->
        <div class="consent-group">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I agree to receive weekly updates and emails. You can unsubscribe at any time.</label>
        </div>

        <!-- Cloudflare Turnstile Widget -->
        <!-- Replace '1x00000000000000000000AA' with your actual Turnstile Site Key from Cloudflare -->
        <div class="captcha-group">
            <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
        </div>

        <button type="submit" id="submit-btn">Notify Me</button>
    </form>
    <div id="form-msg"></div>
</div>

<script>
    // Fetch CMS settings
    fetch('/content/settings.json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('page-title').innerText = data.title || "Coming Soon";
            document.getElementById('headline').innerText = data.headline || "Something new is coming.";
            document.getElementById('subheadline').innerText = data.subheadline || "Sign up for updates.";
        })
        .catch(err => console.error('Content load error:', err));

    // Handle Form Submission
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const consentChecked = document.getElementById('consent').checked;
        const msgEl = document.getElementById('form-msg');
        const btn = document.getElementById('submit-btn');

        // Extract CAPTCHA token generated by Turnstile
        const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

        if (!consentChecked) {
            msgEl.style.color = "#f87171";
            msgEl.innerText = "Please agree to the opt-in consent to subscribe.";
            return;
        }

        if (!turnstileToken) {
            msgEl.style.color = "#f87171";
            msgEl.innerText = "Please complete the anti-spam verification.";
            return;
        }

        btn.disabled = true;
        msgEl.style.color = "#94a3b8";
        msgEl.innerText = "Subscribing...";

        try {
            const response = await fetch('/.netlify/functions/subscribe', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ 
                    name, 
                    email, 
                    consent: consentChecked,
                    captchaToken: turnstileToken 
                })
            });

            const result = await response.json();

            if (response.ok) {
                msgEl.style.color = "#4ade80";
                msgEl.innerText = "Success! Please check your inbox to confirm your subscription.";
                document.getElementById('signup-form').reset();
                if (window.turnstile) window.turnstile.reset();
            } else {
                throw new Error(result.error || 'Subscription failed.');
            }
        } catch (error) {
            msgEl.style.color = "#f87171";
            msgEl.innerText = error.message || "Something went wrong. Please try again later.";
            btn.disabled = false;
            if (window.turnstile) window.turnstile.reset();
        }
    });

    // Netlify Identity Login Redirect
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>

</body>
</html>
